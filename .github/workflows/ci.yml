# CI: the repo gate (scripts/check.sh) on stable for Linux and macOS, plus
# check and test on the MSRV. The [Neovim](https://neovim.io) smoke test
# stays manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }}, stable)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Keep any index cache a test opens out of the runner's home. The
      # runner context is not available in job-level env, so export it here
      # for every later step.
      - run: echo "MDROOTS_CACHE_DIR=$RUNNER_TEMP/mdroots-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/check.sh

  msrv:
    name: msrv (ubuntu-latest, 1.89)
    runs-on: ubuntu-latest
    steps:
      - run: echo "MDROOTS_CACHE_DIR=$RUNNER_TEMP/mdroots-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
