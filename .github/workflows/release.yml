# Release: on a `v*` tag, build the mdroots binary for macOS arm64
# (macos-15) and Linux x86_64 (Ubuntu 26.04 LTS) and attach them to a
# GitHub release for the tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p mdroots-cli --bin mdroots
      - name: Package
        shell: bash
        run: |
          name=mdroots-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/mdroots README.md LICENSE* "$name"/
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Smoke test
        run: target/${{ matrix.target }}/release/mdroots check --quiet README.md || [ $? -eq 1 ]
        env:
          MDROOTS_CACHE_DIR: ${{ runner.temp }}/mdroots-cache
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: mdroots-*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" mdroots-*.tar.gz* --clobber
