[workspace]
resolver = "3"
members = [
    "crates/mdroots-syntax",
    "crates/mdroots-resolve",
    "crates/mdroots-core",
    "crates/mdroots-roots",
    "crates/mdroots",
    "tools/zkdiff",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Martin Trojer <martin.trojer@gmail.com>"]
repository = "https://github.com/martintrojer/mdroots"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
