[dependencies]
mdroots-syntax = { path = "../mdroots-syntax", version = "=0.2.5" }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1"

[lints]
workspace = true
