[package]
name = "mdroots-resolve"
version.workspace = true
description = "Link resolution ladder, dialect detection and convention vote for mdroots."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["markdown", "notes", "links", "zettelkasten"]
