[package]
name = "mdroots-syntax"
version.workspace = true
description = "Parse one markdown or org document into structure and liberal link candidates."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["markdown", "org-mode", "parser", "wiki-links", "frontmatter"]
categories = ["parser-implementations", "text-processing"]

[lints]
workspace = true

[dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
saphyr = "0.1"
toml = { version = "1", default-features = false, features = ["parse", "display", "serde", "preserve_order"] }
unicode-general-category = "1.1"

[dev-dependencies]
proptest = "1"
insta = "1"
