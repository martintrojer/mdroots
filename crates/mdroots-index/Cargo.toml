[package]
name = "mdroots-index"
version.workspace = true
description = "Persistent per-root index cache for mdroots: cache dir choice, reconciler locks and a SQLite (https://sqlite.org) DB."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["markdown", "notes", "sqlite", "cache"]
categories = ["database", "caching"]

[dependencies]
mdroots-core = { path = "../mdroots-core", version = "=0.2.1" }
mdroots-roots = { path = "../mdroots-roots", version = "=0.2.1" }
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
tempfile = "3"

[lints]
workspace = true
