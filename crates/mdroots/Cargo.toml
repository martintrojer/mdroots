[package]
name = "mdroots"
version.workspace = true
description = "Markdown and org note roots: discover a root, index it in memory, resolve links, backlinks and diagnostics."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["markdown", "org-mode", "notes", "zettelkasten", "wiki-links"]
categories = ["text-processing", "parser-implementations"]

[dependencies]
mdroots-syntax = { path = "../mdroots-syntax", version = "=0.2.7" }
mdroots-resolve = { path = "../mdroots-resolve", version = "=0.2.7" }
mdroots-core = { path = "../mdroots-core", version = "=0.2.7" }
mdroots-roots = { path = "../mdroots-roots", version = "=0.2.7" }
mdroots-index = { path = "../mdroots-index", version = "=0.2.7" }
notify = "8"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
