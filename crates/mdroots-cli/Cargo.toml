[package]
name = "mdroots-cli"
version = "0.0.0"
description = "The mdroots command line: check, roots, resolve and backlinks over a notes root, and the language server."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The binary shares its name with the `mdroots` library, so `cargo doc`
# warns about an output filename collision
# (https://github.com/rust-lang/cargo/issues/6313). Harmless: the binary has
# no docs worth building, and scripts/check.sh does not run `cargo doc`.
[[bin]]
name = "mdroots"
path = "src/main.rs"
doc = false

[dependencies]
mdroots = { path = "../mdroots", version = "0.0.0" }
mdroots-lsp = { path = "../mdroots-lsp", version = "0.0.0" }
lsp-server = "0.7"

[dev-dependencies]
insta = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
